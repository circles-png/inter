name: Build

on:
  push:
    branches:
      - "svelte-static"
  pull_request:
    branches:
      - "svelte-static"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "pnpm"
      - run: |
          cd frontend
          pnpm i --frozen-lockfile
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          path: .

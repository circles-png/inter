name: Build

on:
  push:
    branches:
      - "svelte-static"
  pull_request:
    branches:
      - "svelte-static"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'
      - run: cd frontend
      - run: npm ci
      - run: npm run build
      - run: cd ..
      - uses: actions/upload-artifact@v4
        with:
          path: .

name: Build

on:
  push:
    branches:
      - "svelte-static"
  pull_request:
    branches:
      - "svelte-static"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - run: |
          cd frontend
          npm i
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          path: .

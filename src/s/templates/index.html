<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <video id="stream" autoplay playsinline controls class="w-full"></video>
    <script>
        (async () => {
            const SERVER = "http://127.0.0.1:5001"
            const ENDPOINT = "/api/v1/stream/{{ stream_id }}/rx"

            const connection = new RTCPeerConnection({
                iceServers: [{ "urls": "stun:stun.l.google.com:19302" }]
            })
            connection.addTransceiver("video", { direction: "recvonly" })
            connection.addTransceiver("audio", { direction: "recvonly" })

            connection.ontrack = event => {
                console.log("Received track", event.streams[0])
                document.getElementById("stream").srcObject = event.streams[0]
            }
            let offer = await connection.createOffer()
            connection.setLocalDescription(offer)
            let response = await fetch(SERVER + ENDPOINT, {
                method: "POST",
                headers: {
                    "Content-Type": "application/sdp"
                },
                body: offer.sdp
            })
            let answer = await response.text()
            await connection.setRemoteDescription(new RTCSessionDescription({
                sdp: answer,
                type: "answer",
            }))
        })()
    </script>
</body>

</html>
